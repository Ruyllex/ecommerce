<section id="cart-section">
    <div class="cart-container">
        <div class="cart-content">
            <h2>Your Shopping Cart</h2>
            <div class="cart-items">
                <ul id="cart-items"></ul>
                <a>Total: $<span id="cart-total">0.00</span></a>
            </div>
            <button id="pay-button">Pagar</button>
        </div>

        <div class="payment-methods">
            <h2>Payment Methods</h2>
            <ul>
                <li><img src="img/visa.png" alt="Visa"></li>
                <li><img src="img/MasterCardLogo.png" alt="MasterCard"></li>
                <li><img src="img/PaypalLogo.png" alt="PayPal"></li>
            </ul>
        </div>
    </div>
</section>
